[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dropoutt"
# Read from src/dropoutt/__init__.py so there is one place to bump. Carrying the
# number here as well let the two drift: 0.1.4 was tagged here while `dropoutt
# doctor` still reported 0.1.3 from the constant in the package.
dynamic = ["version"]
description = "Pre-flight checks and comparable fingerprints for LLM training datasets."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Cisimcik AI Labs" }]
keywords = ["llm", "training-data", "dataset", "deduplication", "contamination", "sft"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# Core stays deliberately small. NumPy is the only compiled core dependency.
# Tokenizers, file-format support, model backends, and speed accelerators are
# optional. See docs/portability.md.
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "jinja2>=3.1",
    "numpy>=1.24",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Rust accelerators. Same results, faster. Skipped automatically if unavailable.
fast = [
    "orjson>=3.9",
    "rensa>=0.4.1",
]
# Exact token counting and chat-template rendering against a real tokenizer.
tokenizer = [
    "tokenizers>=0.15",
    "huggingface_hub>=0.23",
]
# Arrow columnar formats. Heaviest single dependency (35-50 MB), never in core.
parquet = [
    "pyarrow>=14.0",
]
# Zstandard input. gzip, bzip2 and xz use the standard library.
zstd = [
    "zstandard>=0.22",
]
# Language identification. lid.176.ftz is a 938 KB model.
lid = [
    "fasttext-langdetect>=1.0",
]
# Atlas coverage. Static CPU embeddings, no torch.
atlas = [
    "model2vec>=0.4",
    "scipy>=1.10",
]
all = [
    "dropoutt[fast,tokenizer,parquet,zstd,lid,atlas]",
]
dev = [
    "dropoutt[all]",
    "pytest>=8.0",
    "scikit-learn>=1.3",
]

[project.scripts]
dropoutt = "dropoutt.cli:run"

[project.urls]
Homepage = "https://dropoutt.com"
Documentation = "https://dropoutt.com"

[tool.hatch.version]
path = "src/dropoutt/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
# `packages` already carries everything under src/dropoutt, including data/.
# A force-include of data/ on top of this adds every file a second time and
# hatchling refuses to build: "A second file is being added to the wheel
# archive at the same path". Do not add one back.
packages = ["src/dropoutt"]
exclude = ["**/.DS_Store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
