[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dropoutt"
# Read from src/dropoutt/__init__.py so there is one place to bump. Carrying the
# number here as well let the two drift: 0.1.4 was tagged here while the version
# command still reported 0.1.3 from the constant in the package.
dynamic = ["version"]
description = "Pre-flight checks for LLM training data. Find what is wrong before you spend a training run finding out."
readme = "README.md"
# PEP 639. An SPDX expression plus the file, rather than `{ file = "LICENSE" }`,
# which inlines the whole Apache text into the metadata and renders on PyPI as a
# wall of legal boilerplate where the licence name should be.
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "dropoutt", email = "cagrokan@gmail.com" }]
maintainers = [{ name = "dropoutt", email = "cagrokan@gmail.com" }]
keywords = [
    "llm",
    "training-data",
    "dataset",
    "data-quality",
    "deduplication",
    "contamination",
    "sft",
    "fine-tuning",
    "tokenizer",
    "dataset-curation",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Natural Language :: Turkish",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]

# One install, everything works. There are no extras.
#
# The extras were a portability story that did not survive contact with users:
# every one of them was a way to end up with a dropoutt that silently could not
# read your Parquet or identify your languages, and the most common support
# question was a capability table explaining which flag would have prevented it.
#
# The hard constraint that replaced them: **every dependency here must publish a
# wheel for every Python and platform in `requires-python` and the classifiers
# above.** Nothing in this list may be built from source at install time. That
# is not a preference — a user on Windows and CPython 3.14 hit
# `fasttext-predict`, which has no wheel for that interpreter, and pip fell
# through to compiling it, which failed on "Microsoft Visual C++ 14.0 or greater
# is required". A dependency that needs a C++ toolchain to install is a
# dependency this package cannot have.
#
# Check before adding one:
#
#     uv pip compile pyproject.toml --python-version 3.14 \
#         --python-platform windows --only-binary :all:
#
# It must resolve. `tests/test_packaging.py` asserts the same property.
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "jinja2>=3.1",
    "numpy>=1.24",
    "tomli>=2.0; python_version < '3.11'",
    # Faster JSON on the deserialize-heavy JSONL path.
    "orjson>=3.9",
    # Exact token counting and chat-template rendering. Pure-Rust, abi3 wheels.
    "tokenizers>=0.15",
    "huggingface_hub>=0.23",
    # Arrow columnar formats: .parquet, .arrow, .feather, .orc.
    "pyarrow>=14.0",
    # Zstandard input. gzip, bzip2 and xz use the standard library.
    "zstandard>=0.22",
    # Language identification over 97 languages. Pure Python plus numpy, 768 KB
    # of model data in the wheel, and nothing to compile. Replaced
    # fasttext-langdetect, which is the dependency that broke Windows installs.
    "py3langid>=0.3",
    # Atlas coverage. The encoder is a quantised lookup table this package
    # stores and reads itself; scipy supplies the one sparse multiply that
    # pools it. No torch, no ONNX runtime, and since 1.2 no model2vec — it
    # copied the whole table on the way in and pulled joblib, tqdm and rich
    # behind it for a lookup and an average.
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "scikit-learn>=1.3",
]

[project.scripts]
dropoutt = "dropoutt.cli:run"

[project.urls]
Homepage = "https://dropoutt.com"
# dropoutt.com/docs is not published yet and returned 404, which is what the
# PyPI sidebar would have linked to. Point at the docs that exist; switch back
# when the site has that page.
Documentation = "https://github.com/ckproduces/dropoutt-cli/tree/v1.2.0/docs"
Source = "https://github.com/ckproduces/dropoutt-cli"
Issues = "https://github.com/ckproduces/dropoutt-cli/issues"
Changelog = "https://github.com/ckproduces/dropoutt-cli/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/dropoutt/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
# `packages` already carries everything under src/dropoutt, including data/.
# A force-include of data/ on top of this adds every file a second time and
# hatchling refuses to build: "A second file is being added to the wheel
# archive at the same path". Do not add one back.
packages = ["src/dropoutt"]
exclude = ["**/.DS_Store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
# No `python_version` pin. Setting it to 3.10 makes mypy parse *every* stub at
# that version, and numpy's use PEP 695 `type` statements, so the check died on
# numpy rather than on this package. Our own floor is enforced by ruff's
# target-version instead, which only reads our source.
files = ["src/dropoutt"]
# Every heavy dependency is imported at its point of use, and the type check has
# to pass on a machine where none of them are installed. Missing stubs for
# tokenizers, pyarrow or model2vec are not type errors in this package.
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "PL"]
ignore = [
    # Imports inside functions are the rule here, not the exception. Every heavy
    # module is loaded at the point of use so that `dropoutt --help` does not pay
    # for numpy, tokenizers and the atlas. Flagging each one would mean 55
    # suppression comments explaining the same decision.
    "PLC0415",
    # Argument and branch counts. `scan` has fourteen flags because the command
    # surface is frozen; splitting it to satisfy a counter would move the
    # complexity rather than remove it.
    "PLR0912", "PLR0913", "PLR0915",
    # Magic numbers. This package is full of measured thresholds, and each one
    # is a named constant with the measurement in the comment above it.
    "PLR2004",
    # Ambiguous Unicode. The tool exists to work on non-English corpora, so
    # Turkish letters and typographic punctuation appear in literals, test
    # fixtures and prose on purpose. Direction-changing characters are a real
    # hazard and are still caught, by PLE2502.
    "RUF001", "RUF002", "RUF003",
    # typer declares flags as call expressions in argument defaults. That is
    # the framework's entire interface.
    "B008",
    # Return-statement and positional-argument counts. A ladder of guard
    # clauses that each return a reason is the readable form of "why not", and
    # `scan` takes fifteen arguments because those are its fifteen flags.
    "PLR0911", "PLR0917",
    # `global` for a lazily-built lookup table that is then never rewritten.
    # The alternative is a module-level dict wrapper that says less.
    "PLW0603",
]

[tool.ruff.lint.per-file-ignores]
# Tests say what they assert in their names and docstrings.
"tests/*" = ["E501", "PLR2004"]
# Most of this file is one HTML template. Wrapping a tag across lines to fit a
# column limit makes the markup harder to read, not easier.
"src/dropoutt/report/html.py" = ["E501"]
# Build scripts, run by hand, not shipped in the wheel.
"tools/*" = ["E501", "PLW2901", "RUF046"]
